<!doctype html>
<html lang="pl" data-release="486128cbbb7158d53dd804129cbec8ea1b61a39a22463b46cb3b1204cf19cb13">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
  <meta name="theme-color" content="#101820">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ageward">
  <meta name="description" content="Broń zamku przed dinozaurami, rozwijaj wyposażenie i przechodź kolejne etapy.">
  <title>Ageward</title>
  <link rel="manifest" href="./manifest.webmanifest?v=486128cbbb7158d53dd804129cbec8ea1b61a39a22463b46cb3b1204cf19cb13">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css?v=486128cbbb7158d53dd804129cbec8ea1b61a39a22463b46cb3b1204cf19cb13">
</head>
<body>
  <main id="game-viewport">
  <canvas id="unity-canvas" width="960" height="600" tabindex="-1" aria-label="Ageward"></canvas>
  <div id="safe-area-probe" aria-hidden="true"></div>
  <section id="loading-screen" aria-live="polite">
    <div class="loading-card">
      <img class="game-icon" src="./icons/icon-192.png" alt="" width="80" height="80">
      <h1>Ageward</h1>
      <p id="loading-status">Przygotowywanie gry…</p>
      <div id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill"></div>
      </div>
      <div class="loading-actions">
        <button id="fullscreen-button" type="button" hidden>Pełny ekran</button>
        <button id="install-button" type="button" hidden>Zainstaluj</button>
        <button id="retry-button" type="button" hidden>Spróbuj ponownie</button>
      </div>
      <details id="error-details" hidden><summary>Szczegóły błędu</summary><pre id="error-text"></pre></details>
    </div>
  </section>
  </main>
  <script src="./orientation.js?v=486128cbbb7158d53dd804129cbec8ea1b61a39a22463b46cb3b1204cf19cb13"></script>
<script>
(function () {
  "use strict";
  const RELEASE = "486128cbbb7158d53dd804129cbec8ea1b61a39a22463b46cb3b1204cf19cb13";
  const base = new URL("./", window.location.href);
  const canvas = document.getElementById("unity-canvas");
  const loading = document.getElementById("loading-screen");
  const status = document.getElementById("loading-status");
  const progress = document.getElementById("progress-fill");
  const progressTrack = document.getElementById("progress-track");
  const fullscreenButton = document.getElementById("fullscreen-button");
  const installButton = document.getElementById("install-button");
  let installPrompt = null;
  let failed = false;

  function buildFile(filename) {
    const url = new URL("Build/" + filename, base);
    url.searchParams.set("v", RELEASE);
    return url.href;
  }

  // The viewport adapter also rotates cutout insets when native orientation lock is unavailable.
  window.towerSafeArea = function () {
    return window.towerViewport.safeArea();
  };

  function showFailure(error) {
    failed = true;
    loading.hidden = false;
    status.textContent = "Nie udało się uruchomić gry. Sprawdź połączenie i spróbuj ponownie.";
    document.getElementById("retry-button").hidden = false;
    document.getElementById("error-details").hidden = false;
    document.getElementById("error-text").textContent = String(error || "Nieznany błąd ładowania.").slice(0, 2000);
    console.error(error);
  }

  // Embedded app browsers own their outer chrome. Offer this only when a real
  // document fullscreen request is available, never as a cosmetic canvas resize.
  let fullscreenFailed = false;
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function canFullscreen() {
    const embedded = /FBAN|FBAV|FB_IAB|Messenger|Instagram/i.test(navigator.userAgent || "");
    const target = document.documentElement;
    const supported = (document.fullscreenEnabled === true && typeof target.requestFullscreen === "function") ||
      (document.webkitFullscreenEnabled === true && typeof target.webkitRequestFullscreen === "function");
    return !embedded && supported;
  }
  function refreshFullscreenButton() {
    const standalone = navigator.standalone === true ||
      (typeof window.matchMedia === "function" && window.matchMedia("(display-mode: standalone)").matches);
    fullscreenButton.hidden = fullscreenFailed || standalone || isFullscreen() || !canFullscreen();
  }
  fullscreenButton.addEventListener("click", async function () {
    fullscreenButton.disabled = true;
    try {
      await window.towerEnterLandscape();
      if (!isFullscreen()) fullscreenFailed = true;
    } catch (_) { fullscreenFailed = true; }
    finally { fullscreenButton.disabled = false; refreshFullscreenButton(); }
  });
  document.addEventListener("fullscreenchange", refreshFullscreenButton);
  document.addEventListener("webkitfullscreenchange", refreshFullscreenButton);
  window.addEventListener("pageshow", refreshFullscreenButton);
  refreshFullscreenButton();
  document.getElementById("retry-button").addEventListener("click", function () { window.location.reload(); });

  window.addEventListener("beforeinstallprompt", function (event) {
    // Keep the browser install affordance available after the loader is hidden.
    installPrompt = event;
    installButton.hidden = false;
  });
  installButton.addEventListener("click", async function () {
    if (!installPrompt) return;
    await installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installButton.hidden = true;
  });
  window.addEventListener("appinstalled", function () {
    installPrompt = null;
    installButton.hidden = true;
  });

  // Registration starts after Unity boot succeeds, so offline preparation never blocks the game loader.
  function prepareOffline() {
    if (!("serviceWorker" in navigator) || !window.isSecureContext) return;
    navigator.serviceWorker.register(new URL("sw.js?v=" + RELEASE, base).href, { scope: base.href, updateViaCache: "none" })
      .catch(function (error) { console.warn("Offline cache could not be prepared:", error); });
  }

  const config = {
    arguments: [],
    dataUrl: buildFile("30a1b65895138cb8d09bc2b8425be35f.data.unityweb"),
    frameworkUrl: buildFile("67ef99241587804d329fe3bf5bd376b3.framework.js.unityweb"),
    codeUrl: buildFile("5d1e6d440dc8553c73b7606999977f13.wasm.unityweb"),
    streamingAssetsUrl: new URL("StreamingAssets", base).href,
    companyName: "Eryk Potocki",
    productName: "Ageward",
    productVersion: "2026.10.31.0943",
    autoSyncPersistentDataPath: true,
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner: function (message, type) {
      if (type === "error") showFailure(message);
      else console.warn(message);
    }
  };

  if (!("WebAssembly" in window)) {
    showFailure("Ta przeglądarka nie obsługuje WebAssembly.");
    return;
  }
  const script = document.createElement("script");
  script.src = buildFile("d775319f6d6393ae9d4aa5bba4559e95.loader.js");
  script.onerror = function () { showFailure("Nie można pobrać pliku uruchamiającego Unity. " + script.src); };
  script.onload = function () {
    if (typeof createUnityInstance !== "function") {
      showFailure("Plik uruchamiający Unity nie został poprawnie załadowany.");
      return;
    }
    createUnityInstance(canvas, config, function (value) {
      const percent = Math.min(99, Math.round(Math.max(0, Math.min(1, value)) * 100));
      progress.style.width = percent + "%";
      progressTrack.setAttribute("aria-valuenow", String(percent));
      status.textContent = percent < 90 ? "Pobieranie plików gry… " + percent + "%" : "Uruchamianie gry… " + percent + "%";
    }).then(function (instance) {
      if (failed) return;
      window.towerUnityInstance = instance;
      progress.style.width = "100%";
      progressTrack.setAttribute("aria-valuenow", "100");
      status.textContent = "Gotowe";
      // The WebGL build opens MainActivity directly. Keep the same loader until its first frame.
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        if (failed) return;
        loading.hidden = true;
        canvas.focus();
        prepareOffline();
      }); });
    }).catch(showFailure);
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
